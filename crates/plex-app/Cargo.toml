[package]
name = "plex-app"
version = "0.4.0"
edition = "2021"
description = "L3 egui desktop dashboard calling plex-core in-process (ArtCraft native stack)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "plex-app"
path = "src/main.rs"

[dependencies]
plex-core = { path = "../plex-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
eframe = { workspace = true }
keyring = { workspace = true }
image = { workspace = true }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu"] }

[lints]
workspace = true
